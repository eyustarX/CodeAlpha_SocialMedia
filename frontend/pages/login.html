<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SocialAlpha</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">🌐 <span>SocialAlpha</span></a>
    <div class="nav-links">
      <a href="index.html">Feed</a>
      <a href="register.html">Sign up</a>
    </div>
  </nav>

  <main class="container">
    <div class="auth-card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem;">Sign in to your SocialAlpha account</p>

      <div id="error-box" class="alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="identifier">Email or Username</label>
          <input type="text" id="identifier" required placeholder="username or email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; border-radius: var(--radius); font-size: 1rem;">Sign In</button>
      </form>

      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Sign up</a>
      </p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await api.post('/auth/login', { identifier, password });
        auth.setAuth(response.data.token, response.data.user);
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
