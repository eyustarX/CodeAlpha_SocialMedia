<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SocialAlpha</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">🌐 <span>SocialAlpha</span></a>
    <div class="nav-links">
      <a href="index.html">Feed</a>
      <a href="login.html">Log in</a>
    </div>
  </nav>

  <main class="container">
    <div class="auth-card">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Join SocialAlpha</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; text-align: center; font-size: 0.9rem;">Connect with creators around the world</p>

      <div id="error-box" class="alert-error"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label for="username">Username (unique handle)</label>
          <input type="text" id="username" required placeholder="janedoe">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="jane@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password (min 6 chars)</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="bio">Short Bio (optional)</label>
          <textarea id="bio" rows="2" placeholder="Software engineer, coffee lover..."></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; border-radius: var(--radius); font-size: 1rem;">Create Account</button>
      </form>

      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Log in</a>
      </p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const bio = document.getElementById('bio').value.trim();

      try {
        const response = await api.post('/auth/register', { name, username, email, password, bio });
        auth.setAuth(response.data.token, response.data.user);
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
